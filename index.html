<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ココスピーチ｜日常英会話フレーズ集</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --woman-bg: #fdf2f8;
      --woman-border: #fbcfe8;
      --woman-text: #be185d;
      --man-bg: #eff6ff;
      --man-border: #bfdbfe;
      --man-text: #1d4ed8;
      --kana-bg: #fefce8;
      --kana-border: #fef08a;
      --border: #e2e8f0;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 120px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0;
      color: var(--primary);
    }

    .app-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 2px 0 0;
    }

    .toggle-group {
      display: flex;
      gap: 6px;
    }

    .toggle-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .scene-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: none;
    }

    .scene-tabs::-webkit-scrollbar {
      display: none;
    }

    .scene-tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .scene-tab.active {
      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
    }

    main {
      max-width: 720px;
      margin: 16px auto 0;
      padding: 0 14px;
    }

    .scene-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .scene-badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .scene-heading {
      margin: 0 0 4px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .scene-desc {
      margin: 0 0 12px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .play-all-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 12px 16px;
      cursor: pointer;
    }

    .play-all-btn.playing {
      background: #dc2626;
    }

    .dialogue-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .dialogue-card:active {
      transform: scale(0.99);
    }

    .dialogue-card.speaking {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.16);
    }

    .speaker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .speaker-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.85rem;
      border: 1.5px solid transparent;
    }

    .avatar.woman {
      background: var(--woman-bg);
      border-color: var(--woman-border);
      color: var(--woman-text);
    }

    .avatar.man {
      background: var(--man-bg);
      border-color: var(--man-border);
      color: var(--man-text);
    }

    .speaker-name {
      font-weight: 800;
      font-size: 0.9rem;
    }

    .listen-chip {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .english-text {
      font-size: calc(1.12rem * var(--font-scale));
      font-weight: 800;
      color: #0f172a;
      margin: 4px 0 8px;
    }

    .kana-box {
      background: var(--kana-bg);
      border: 1px solid var(--kana-border);
      color: #713f12;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: calc(0.92rem * var(--font-scale));
      font-weight: 600;
      margin-bottom: 8px;
    }

    .japanese-text {
      font-size: calc(0.95rem * var(--font-scale));
      color: #334155;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .controls-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
    }

    .controls-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text);
    }

    .pill-group {
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .voice-note {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
